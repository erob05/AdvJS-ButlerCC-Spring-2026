<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ER API Project</title>
    <link href="main.css" rel="stylesheet">
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Exo+2:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <a href="/">Home</a>
        <h1 class="center" id="margin">Pick your Legendary Final Fantasy Mount</h1>
        <div class="center"><button id="choco">Fat Chocobo</button><button id="fire">Firebird</button><button id="mog">Fat Moggle</button></div>
    </header>
    <main>
        <div class="hide div" id="content">
            <h2 id="name"></h2>
            <img alt="No mount image found" id="img">
            <p id="tool"></p>
            <p id="des"></p>
            <p id="act"></p>
            <p id="expac"></p><img class="expac" id="exImg" src="" alt="No expac banner found">
        </div>
    </main>
    <footer class="center">
        <p>Images from Final Fantasy XIV. Used for educational/fan purposes. All rights reserved by Square Enix.</p>
        <p>&copy; Eric Roberts 2026</p>
    </footer>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js" integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="script.js"></script>
</body>
</html>
